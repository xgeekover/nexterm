name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Every job gets read-only access; the one job that needs to write to the
# repository (release) asks for it itself. A PR from a fork must never be able
# to reach a token that can publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Bundling Monaco's language workers exceeds node's default heap on the
  # macOS runner.
  NODE_OPTIONS: --max-old-space-size=4096

# Actions are pinned to commit SHAs, not tags: a tag can be moved onto new code
# by whoever owns the action, and these run with access to the build. The
# trailing comment records which version each SHA was, so bumping one stays a
# readable diff.

jobs:
  # Runs on all three platforms, not just Linux.
  #
  # What this actually buys: the Rust suite spawns real shells, opens real
  # PTYs and reads real directories, so it behaves differently on each OS —
  # ConPTY is not a unix pty, and `C:\Users\me\project\src` is not a path
  # any `/`-shaped assumption survives. The JS suites feed themselves
  # synthetic input and would pass anywhere; they run here because they are
  # quick and catch a harness that does not work on Windows, not because they
  # test the platform.
  #
  # It does NOT, on its own, catch the kind of defect that shipped in v0.2.1
  # (menu shortcuts with no handler) or v0.2.3 (a missing `windows_subsystem`
  # attribute). Those needed a test to exist at all; writing one is what found
  # them. What the matrix adds is that a platform-sensitive test is actually
  # run on that platform — and that a Windows compile error in test-only code
  # surfaces here rather than ten minutes later in `build`, where it reads as
  # a packaging problem.
  test:
    name: test (${{ matrix.platform }})
    strategy:
      # One platform failing must not hide the others: seeing that a case fails
      # on Windows and passes on macOS is most of the diagnosis.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise the job token is written into .git/config, where an npm
          # lifecycle script or a build.rs can read it back out.
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # The project commands suite hands quoted values through every shell it
      # finds and compares what arrives (tests/adversarial/project_commands.test.js);
      # without these two the zsh and fish cases skip here, and fish is
      # checked nowhere.
      - name: Install zsh and fish for the quoting round trips
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get install -y zsh fish

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # nexterm-cli is a workspace of its own (src-tauri/cli/Cargo.toml).
          workspaces: |
            src-tauri
            src-tauri/cli
          key: test-${{ matrix.platform }}

      - name: Install npm dependencies
        run: npm ci

      # Before anything is run: the suites below never mount a component, so a
      # mistake in a render reaches CI as several hundred green cases and a
      # white screen on the user's machine. `no-undef` and
      # react/no-unstable-nested-components are the two rules that would have
      # caught every instance of that this project has had.
      - name: Lint
        run: npm run lint

      # Runs first on purpose: it writes tests/fixtures/backend-tree.json from a
      # real directory tree on THIS platform, which the adversarial suite below
      # reads back and pushes through the real explorer code.
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      # nexterm-cli is its own crate, outside the app's workspace, so the step
      # above never reaches it. Its suite checks the socket's and the pipe's
      # owner against real ones of its own, and runs the built binary against
      # a fake NexTerm (a socket here, a real named pipe on Windows). Run from
      # the crate's folder (`cargo test --manifest-path src-tauri/cli/Cargo.toml`
      # from anywhere else would test the same code): that is where cargo picks
      # up its .cargo/config.toml, so the binary under test is linked as the one
      # that ships.
      - name: CLI test
        working-directory: src-tauri/cli
        run: cargo test

      - name: E2E tests
        run: node tests/e2e/runner.js

      - name: Adversarial tests
        shell: bash
        # Into a file as well as the log, kept as an artifact: on Windows the
        # step's log has stopped mid-run with the process still going (the
        # step ended with the suite's own exit code), and the file is what
        # says what happened after. NEXTERM_TEST_TRACE names each case as it
        # starts there.
        run: |
          set -o pipefail
          node tests/adversarial/runner.js 2>&1 | tee adversarial-output.txt
        env:
          NEXTERM_TEST_TRACE: ${{ matrix.platform == 'windows-latest' && '1' || '' }}

      - name: Keep the adversarial output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adversarial-output-${{ matrix.platform }}
          path: adversarial-output.txt
          retention-days: 7

      # The only suite that mounts a component. The other three run against a
      # mock backend and never draw anything, so this is what stands between a
      # render-time mistake and a white screen on the user's machine.
      - name: Render tests
        run: node tests/render/runner.js

  build:
    name: build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise the job token is written into .git/config, where an npm
          # lifecycle script or a build.rs can read it back out.
          persist-credentials: false

      # `rpm` only reads the built .rpm back (the CLI must be inside it); the
      # bundler does not need it.
      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            src-tauri/cli

      - name: Install npm dependencies
        run: npm ci

      # nexterm-cli, which every installer carries beside the app (Tauri's
      # bundle.externalBin), staged as src-tauri/binaries/nexterm-cli-<triple>.
      # The overlay passed below runs this again before it compiles the app
      # (its beforeBuildCommand) and finds nothing left to build; it is a step
      # of its own so that a CLI that does not build says so here, and not in
      # the middle of the bundler's log.
      - name: Build nexterm-cli
        run: npm run build:cli

      # Builds only. This job never receives GITHUB_TOKEN and never publishes
      # anything — a tag build produces exactly the same bundles as a branch
      # build, and the release job below is the only thing that can put them
      # in front of users.
      #
      # tauri.sidecar.conf.json adds bundle.externalBin. It is not in
      # tauri.conf.json because tauri-build insists the file exists whenever
      # the app crate compiles — which would break `cargo test` in the test
      # job and every developer's `cargo check` until the CLI had been built.
      - name: Build bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --config src-tauri/tauri.sidecar.conf.json

      # A Tauri app is a single self-contained exe; zipping it gives Windows
      # users a no-install build. It still needs the WebView2 runtime, which
      # ships with Windows 10 22H2+ and Windows 11.
      # The real check that no console window appears. The Rust test only greps
      # main.rs for the attribute; whether the LINKER honoured it is a property
      # of the binary, and this is the first moment a binary exists. v0.2.2
      # shipped with Subsystem=3 and users got an empty black terminal beside
      # the app.
      - name: The app must not be a console application
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File |
            Where-Object { $_.BaseName -ieq "nexterm" } |
            Select-Object -First 1
          if (-not $exe) { throw "no NexTerm binary in src-tauri/target/release" }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 2) -ne 'PE') {
            throw "$($exe.Name) has no PE signature at $peOffset"
          }
          # COFF header is 20 bytes; Subsystem sits 68 bytes into the optional
          # header that follows it, for both PE32 and PE32+.
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 4 + 20 + 68)
          "Subsystem = $subsystem (2 = WINDOWS_GUI, 3 = WINDOWS_CUI)"
          if ($subsystem -ne 2) {
            throw "$($exe.Name) is Subsystem=$subsystem — Windows will open a console window beside the app"
          }

      # The other way round for nexterm-cli: it must BE a console program, or
      # cmd and PowerShell neither wait for it nor show what it prints. And it
      # must not need VCRUNTIME140.dll, which a PC without the Visual C++
      # redistributable lacks (the app links its C runtime in; so does the CLI,
      # src-tauri/cli/.cargo/config.toml). This is the copy tauri-build put
      # beside the app because the overlay named it in bundle.externalBin.
      - name: nexterm-cli must be a standalone console application
        if: matrix.platform == 'windows-latest'
        run: node src-tauri/cli/check-windows-exe.mjs src-tauri/target/release/nexterm-cli.exe

      - name: Package Windows portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Tauri renames the cargo binary (nexterm.exe) to productName
          # (NexTerm.exe) before bundling, so accept either spelling.
          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File |
            Where-Object { $_.BaseName -ieq "nexterm" } |
            Select-Object -First 1
          if (-not $exe) { throw "no NexTerm binary in src-tauri/target/release" }
          # Beside NexTerm.exe, as the installers put it: the app finds it
          # there and puts that folder first on PATH in its terminals.
          $cli = "src-tauri/target/release/nexterm-cli.exe"
          if (-not (Test-Path $cli)) { throw "no $cli — the bundle was built without src-tauri/tauri.sidecar.conf.json" }
          $name = "NexTerm-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item $exe.FullName "$name/NexTerm.exe"
          Copy-Item $cli "$name/nexterm-cli.exe"
          Copy-Item "README.md" "$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force

      # Read every bundle back: nexterm-cli must be inside each one, beside the
      # app, and run. The release job below publishes these files as they are,
      # so this is the last look at them.
      - name: nexterm-cli must be inside every bundle (macOS, Linux)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          fail() { echo "::error::$*"; exit 1; }
          # Listings go into a variable first: `… | grep -q` under pipefail
          # fails when grep stops reading early.
          has() { grep -qE "$2" <<<"$1"; }
          case "$RUNNER_OS" in
            macOS)
              app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
              [ -n "$app" ] || fail "no .app in $bundle/macos"
              cli="$app/Contents/MacOS/nexterm-cli"
              [ -x "$cli" ] || fail "$app has no Contents/MacOS/nexterm-cli"
              "$cli" --version
              while IFS= read -r tgz; do
                has "$(tar -tzf "$tgz")" '\.app/Contents/MacOS/nexterm-cli$' || fail "$tgz has no nexterm-cli"
              done < <(find "$bundle" -name '*.app.tar.gz')
              dmg=$(find "$bundle/dmg" -name '*.dmg' -print -quit)
              [ -n "$dmg" ] || fail "no .dmg in $bundle/dmg"
              mnt=$(mktemp -d)
              hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
              found=$(find "$mnt" -maxdepth 4 -path '*.app/Contents/MacOS/nexterm-cli' -print -quit)
              hdiutil detach "$mnt" >/dev/null
              [ -n "$found" ] || fail "$dmg has no nexterm-cli in its app"
              ;;
            Linux)
              deb=$(find "$bundle/deb" -name '*.deb' -print -quit)
              [ -n "$deb" ] || fail "no .deb in $bundle/deb"
              # Tauri's deb names its entries `usr/bin/…`, other tools `./usr/bin/…`.
              has "$(dpkg-deb -c "$deb")" ' (\./)?usr/bin/nexterm-cli$' || fail "$deb does not install /usr/bin/nexterm-cli"
              rpm=$(find "$bundle/rpm" -name '*.rpm' -print -quit)
              [ -n "$rpm" ] || fail "no .rpm in $bundle/rpm"
              has "$(rpm -qlp "$rpm")" '^/usr/bin/nexterm-cli$' || fail "$rpm does not install /usr/bin/nexterm-cli"
              appimage=$(find "$bundle/appimage" -name '*.AppImage' -print -quit)
              [ -n "$appimage" ] || fail "no .AppImage in $bundle/appimage"
              appimage=$(realpath "$appimage")
              chmod +x "$appimage"
              out=$(mktemp -d)
              (cd "$out" && "$appimage" --appimage-extract >/dev/null)
              [ -x "$out/squashfs-root/usr/bin/nexterm-cli" ] || fail "$appimage has no usr/bin/nexterm-cli"
              "$out/squashfs-root/usr/bin/nexterm-cli" --version
              ;;
          esac

      - name: nexterm-cli must be inside every bundle (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          # The NSIS installer: 7-Zip lists what it would install.
          $setup = Get-ChildItem "$bundle/nsis" -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer in $bundle/nsis" }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          $listing = & $sevenZip l $setup.FullName
          if ($LASTEXITCODE -ne 0) { $listing; throw "7-Zip could not read $($setup.Name)" }
          if (-not ($listing | Select-String -SimpleMatch 'nexterm-cli.exe')) { $listing; throw "$($setup.Name) does not install nexterm-cli.exe" }
          # The MSI: an administrative install only unpacks its files.
          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI in $bundle/msi" }
          $out = Join-Path $env:RUNNER_TEMP "msi-files"
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a $($msi.Name) exited $($p.ExitCode)" }
          $files = Get-ChildItem $out -Recurse -File
          $cli = $files | Where-Object { $_.Name -ieq 'nexterm-cli.exe' } | Select-Object -First 1
          $app = $files | Where-Object { $_.Extension -ieq '.exe' -and $_.BaseName -ieq 'nexterm' } | Select-Object -First 1
          if (-not $cli) { $files.FullName; throw "$($msi.Name) does not install nexterm-cli.exe" }
          if (-not $app -or $cli.DirectoryName -ne $app.DirectoryName) { $files.FullName; throw "$($msi.Name) does not put nexterm-cli.exe beside NexTerm.exe" }
          & $cli.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "the MSI's nexterm-cli.exe --version exited $LASTEXITCODE" }
          # The portable zip, unpacked as a user would.
          $zip = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive "NexTerm-windows-x64-portable.zip" -DestinationPath $zip -Force
          foreach ($f in 'NexTerm.exe', 'nexterm-cli.exe') {
            if (-not (Test-Path (Join-Path $zip $f))) { throw "the portable zip has no $f" }
          }
          & (Join-Path $zip 'nexterm-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "the portable nexterm-cli.exe --version exited $LASTEXITCODE" }

      # Collect the installers into one flat directory so the release job does
      # not have to know Tauri's per-platform bundle layout.
      # NOTE: not `dist/` — that is Vite's output directory, already full of
      # the frontend bundle by the time this runs. Uploading `dist/**` swept
      # several hundred Monaco chunks into the artifact alongside the
      # installers.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf installers && mkdir -p installers
          find src-tauri/target/release/bundle \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' \
               -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.rpm' \) \
            -exec cp {} installers/ \;
          if [ -f NexTerm-windows-x64-portable.zip ]; then
            cp NexTerm-windows-x64-portable.zip installers/
          fi
          echo "collected:"
          ls -la installers/
          # Empty means the bundler silently produced nothing — that used to
          # surface only as a release with assets missing.
          [ -n "$(ls -A installers)" ] || { echo "::error::no installers were produced"; exit 1; }

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexterm-${{ matrix.platform }}
          path: installers/**
          if-no-files-found: error

  release:
    name: release
    # Tags only. A push to main or a pull request can never reach this job, so
    # there is no path from ordinary CI to a published release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Only the build jobs' bundles. The test jobs keep artifacts too (the
      # adversarial suite's output), and without a pattern v0.23.0 published
      # one of them as a release asset.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: nexterm-*

      - name: Gather assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf installers && mkdir -p installers
          find artifacts -type f -exec cp {} installers/ \;
          ls -la installers/

      # The release is only worth publishing if every platform actually landed.
      # v0.1.0 shipped three times with pieces missing because nothing checked.
      - name: Verify every expected asset is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            local label="$1" pattern="$2"
            # shellcheck disable=SC2086
            if compgen -G "installers/$pattern" > /dev/null; then
              echo "  ok       $label -> $(cd installers && ls $pattern | tr '\n' ' ')"
            else
              echo "::error::missing release asset: $label (no installers/$pattern)"
              missing=1
            fi
          }
          echo "expected assets:"
          check "macOS disk image"      "*.dmg"
          check "macOS app archive"     "*.app.tar.gz"
          check "Windows installer"     "*-setup.exe"
          check "Windows MSI"           "*.msi"
          check "Windows portable zip"  "NexTerm-windows-x64-portable.zip"
          check "Linux AppImage"        "*.AppImage"
          check "Linux deb"             "*.deb"
          check "Linux rpm"             "*.rpm"
          [ "$missing" -eq 0 ] || { echo "::error::refusing to publish an incomplete release"; exit 1; }

          # A bundler can also emit a zero-byte file rather than failing.
          while IFS= read -r f; do
            [ -s "$f" ] || { echo "::error::empty asset: $f"; exit 1; }
          done < <(find installers -type f)

          # And nothing but installers: whatever lands here is published.
          extra=0
          while IFS= read -r f; do
            case "$(basename "$f")" in
              *.dmg|*.app.tar.gz|*-setup.exe|*.msi|NexTerm-windows-x64-portable.zip|*.AppImage|*.deb|*.rpm) ;;
              *) echo "::error::not an installer, refusing to publish it: $f"; extra=1 ;;
            esac
          done < <(find installers -type f)
          [ "$extra" -eq 0 ] || exit 1

      # Draft first: the release exists but nobody sees it until the assets
      # have been uploaded AND read back, so a half-uploaded release is never
      # visible to users.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it as a draft"
            gh release edit "$TAG" --draft
          else
            gh release create "$TAG" \
              --draft \
              --title "NexTerm $TAG" \
              --generate-notes
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" installers/* --clobber

      # Read the release back rather than trusting the upload's exit code.
      - name: Verify the uploaded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)\t\(.state)"' > uploaded.tsv
          echo "uploaded:"; cat uploaded.tsv

          # Compare on exact field equality rather than a pattern: asset names
          # carry dots and plus signs that a regex would read as metacharacters.
          fail=0
          while IFS= read -r local; do
            name="$(basename "$local")"
            size="$(wc -c < "$local" | tr -d ' ')"
            read -r remote_size remote_state <<<"$(
              awk -F'\t' -v n="$name" '$1 == n { print $2, $3; found=1 } END { if (!found) print "", "" }' uploaded.tsv
            )"
            if [ -z "$remote_size" ]; then
              echo "::error::asset never arrived: $name"; fail=1; continue
            fi
            if [ "$remote_size" != "$size" ]; then
              echo "::error::$name uploaded at $remote_size bytes, expected $size"; fail=1
            fi
            if [ "$remote_state" != "uploaded" ]; then
              echo "::error::$name is in state '$remote_state', not 'uploaded'"; fail=1
            fi
          done < <(find installers -type f)
          [ "$fail" -eq 0 ] || { echo "::error::leaving the release as a draft"; exit 1; }

      # Only now does it become visible.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

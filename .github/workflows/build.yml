name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Every job gets read-only access; the one job that needs to write to the
# repository (release) asks for it itself. A PR from a fork must never be able
# to reach a token that can publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Bundling Monaco's language workers exceeds node's default heap on the
  # macOS runner.
  NODE_OPTIONS: --max-old-space-size=4096

# Actions are pinned to commit SHAs, not tags: a tag can be moved onto new code
# by whoever owns the action, and these run with access to the build. The
# trailing comment records which version each SHA was, so bumping one stays a
# readable diff.

jobs:
  # Runs on all three platforms, not just Linux.
  #
  # What this actually buys: the Rust suite spawns real shells, opens real
  # PTYs and reads real directories, so it behaves differently on each OS —
  # ConPTY is not a unix pty, and `C:\Users\me\project\src` is not a path
  # any `/`-shaped assumption survives. The JS suites feed themselves
  # synthetic input and would pass anywhere; they run here because they are
  # quick and catch a harness that does not work on Windows, not because they
  # test the platform.
  #
  # It does NOT, on its own, catch the kind of defect that shipped in v0.2.1
  # (menu shortcuts with no handler) or v0.2.3 (a missing `windows_subsystem`
  # attribute). Those needed a test to exist at all; writing one is what found
  # them. What the matrix adds is that a platform-sensitive test is actually
  # run on that platform — and that a Windows compile error in test-only code
  # surfaces here rather than ten minutes later in `build`, where it reads as
  # a packaging problem.
  test:
    name: test (${{ matrix.platform }})
    strategy:
      # One platform failing must not hide the others: seeing that a case fails
      # on Windows and passes on macOS is most of the diagnosis.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise the job token is written into .git/config, where an npm
          # lifecycle script or a build.rs can read it back out.
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: test-${{ matrix.platform }}

      - name: Install npm dependencies
        run: npm ci

      # Runs first on purpose: it writes tests/fixtures/backend-tree.json from a
      # real directory tree on THIS platform, which the adversarial suite below
      # reads back and pushes through the real explorer code.
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: E2E tests
        run: node tests/e2e/runner.js

      - name: Adversarial tests
        run: node tests/adversarial/runner.js

  build:
    name: build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise the job token is written into .git/config, where an npm
          # lifecycle script or a build.rs can read it back out.
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Builds only. This job never receives GITHUB_TOKEN and never publishes
      # anything — a tag build produces exactly the same bundles as a branch
      # build, and the release job below is the only thing that can put them
      # in front of users.
      - name: Build bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0

      # A Tauri app is a single self-contained exe; zipping it gives Windows
      # users a no-install build. It still needs the WebView2 runtime, which
      # ships with Windows 10 22H2+ and Windows 11.
      - name: Package Windows portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Tauri renames the cargo binary (nexterm.exe) to productName
          # (NexTerm.exe) before bundling, so accept either spelling.
          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File |
            Where-Object { $_.BaseName -ieq "nexterm" } |
            Select-Object -First 1
          if (-not $exe) { throw "no NexTerm binary in src-tauri/target/release" }
          $name = "NexTerm-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item $exe.FullName "$name/NexTerm.exe"
          Copy-Item "README.md" "$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force

      # Collect the installers into one flat directory so the release job does
      # not have to know Tauri's per-platform bundle layout.
      # NOTE: not `dist/` — that is Vite's output directory, already full of
      # the frontend bundle by the time this runs. Uploading `dist/**` swept
      # several hundred Monaco chunks into the artifact alongside the
      # installers.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf installers && mkdir -p installers
          find src-tauri/target/release/bundle \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' \
               -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.rpm' \) \
            -exec cp {} installers/ \;
          if [ -f NexTerm-windows-x64-portable.zip ]; then
            cp NexTerm-windows-x64-portable.zip installers/
          fi
          echo "collected:"
          ls -la installers/
          # Empty means the bundler silently produced nothing — that used to
          # surface only as a release with assets missing.
          [ -n "$(ls -A installers)" ] || { echo "::error::no installers were produced"; exit 1; }

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexterm-${{ matrix.platform }}
          path: installers/**
          if-no-files-found: error

  release:
    name: release
    # Tags only. A push to main or a pull request can never reach this job, so
    # there is no path from ordinary CI to a published release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Gather assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf installers && mkdir -p installers
          find artifacts -type f -exec cp {} installers/ \;
          ls -la installers/

      # The release is only worth publishing if every platform actually landed.
      # v0.1.0 shipped three times with pieces missing because nothing checked.
      - name: Verify every expected asset is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            local label="$1" pattern="$2"
            # shellcheck disable=SC2086
            if compgen -G "installers/$pattern" > /dev/null; then
              echo "  ok       $label -> $(cd installers && ls $pattern | tr '\n' ' ')"
            else
              echo "::error::missing release asset: $label (no installers/$pattern)"
              missing=1
            fi
          }
          echo "expected assets:"
          check "macOS disk image"      "*.dmg"
          check "macOS app archive"     "*.app.tar.gz"
          check "Windows installer"     "*-setup.exe"
          check "Windows MSI"           "*.msi"
          check "Windows portable zip"  "NexTerm-windows-x64-portable.zip"
          check "Linux AppImage"        "*.AppImage"
          check "Linux deb"             "*.deb"
          check "Linux rpm"             "*.rpm"
          [ "$missing" -eq 0 ] || { echo "::error::refusing to publish an incomplete release"; exit 1; }

          # A bundler can also emit a zero-byte file rather than failing.
          while IFS= read -r f; do
            [ -s "$f" ] || { echo "::error::empty asset: $f"; exit 1; }
          done < <(find installers -type f)

      # Draft first: the release exists but nobody sees it until the assets
      # have been uploaded AND read back, so a half-uploaded release is never
      # visible to users.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it as a draft"
            gh release edit "$TAG" --draft
          else
            gh release create "$TAG" \
              --draft \
              --title "NexTerm $TAG" \
              --generate-notes
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" installers/* --clobber

      # Read the release back rather than trusting the upload's exit code.
      - name: Verify the uploaded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)\t\(.state)"' > uploaded.tsv
          echo "uploaded:"; cat uploaded.tsv

          # Compare on exact field equality rather than a pattern: asset names
          # carry dots and plus signs that a regex would read as metacharacters.
          fail=0
          while IFS= read -r local; do
            name="$(basename "$local")"
            size="$(wc -c < "$local" | tr -d ' ')"
            read -r remote_size remote_state <<<"$(
              awk -F'\t' -v n="$name" '$1 == n { print $2, $3; found=1 } END { if (!found) print "", "" }' uploaded.tsv
            )"
            if [ -z "$remote_size" ]; then
              echo "::error::asset never arrived: $name"; fail=1; continue
            fi
            if [ "$remote_size" != "$size" ]; then
              echo "::error::$name uploaded at $remote_size bytes, expected $size"; fail=1
            fi
            if [ "$remote_state" != "uploaded" ]; then
              echo "::error::$name is in state '$remote_state', not 'uploaded'"; fail=1
            fi
          done < <(find installers -type f)
          [ "$fail" -eq 0 ] || { echo "::error::leaving the release as a draft"; exit 1; }

      # Only now does it become visible.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name the repository outright rather than letting gh infer it from
          # a git remote — the checkout deliberately keeps no credentials.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

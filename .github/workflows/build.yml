name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Bundling Monaco's language workers exceeds node's default heap on the
  # macOS runner.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: E2E tests
        run: node tests/e2e/runner.js

      - name: Adversarial tests
        run: node tests/adversarial/runner.js

  build:
    name: build (${{ matrix.platform }})
    needs: test
    # Creating the release and uploading the portable zip both write to the
    # repository; the default GITHUB_TOKEN is read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build (release, upload artifacts)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NexTerm ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      # A Tauri app is a single self-contained exe; zipping it gives Windows
      # users a no-install build. It still needs the WebView2 runtime, which
      # ships with Windows 10 22H2+ and Windows 11.
      - name: Package Windows portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Tauri renames the cargo binary (nexterm.exe) to productName
          # (NexTerm.exe) before bundling, so accept either spelling.
          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe -File |
            Where-Object { $_.BaseName -ieq "nexterm" } |
            Select-Object -First 1
          if (-not $exe) { throw "no NexTerm binary in src-tauri/target/release" }
          $name = "NexTerm-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item $exe.FullName "$name/NexTerm.exe"
          Copy-Item "README.md" "$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force

      - name: Attach Windows portable build to the release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "NexTerm-windows-x64-portable.zip" --clobber

      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nexterm-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            NexTerm-windows-x64-portable.zip
          if-no-files-found: ignore

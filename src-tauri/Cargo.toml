[package]
name = "nexterm"
version = "0.13.0"
description = "Next-generation Multi-AI Terminal IDE"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
portable-pty = "0.9.0"
tokio = { version = "1.53.1", features = ["full"] }
notify = "6.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
walkdir = "2.5.0"
# Search across files: the regex mode, and what "whole word" compiles to.
# Already in the tree as a transitive dependency, so this costs no build time.
regex = "1"
# canonicalize without the \\?\ prefix Windows adds — see `Canonical` in src/fs/mod.rs.
dunce = "1.0.5"
tauri-plugin-dialog = "2"
# Hands a URL to the system browser for the links in terminal output. Scoped to
# http/https in capabilities/default.json — see src/lib/openExternal.js for why
# that matters when the text came from a program's output.
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Desktop notifications for what a program in a terminal asks to be told about
# (OpenCode, Claude Code — see src/lib/programNotifications.js). Shown from
# Rust, by `show_desktop_notification` in src/commands/notification.rs.
tauri-plugin-notification = "2"
# The clipboard's text, for a right-click paste in a terminal — read here and
# not by the webview; src/commands/clipboard.rs says why. Text only: with
# `image-data` arboard can tell an image is there only by decoding all of it.
arboard = { version = "3.6", default-features = false }

# getuid(), so the shell-integration files go somewhere only this user can reach.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows build number, which the terminal needs to know how ConPTY wraps lines.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Whether an image is on the clipboard, without reading it
# (src/commands/clipboard.rs). arboard reads the text through it already.
clipboard-win = "5.4"
# Copying a folder link without the privilege a symlink needs (fs/mod.rs
# `copy_link`): std can read a junction but not make one.
junction = "2"

# Whether an image is on the pasteboard, without reading it
# (src/commands/clipboard.rs). arboard reads the text through these already.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

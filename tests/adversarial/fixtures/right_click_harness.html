<!doctype html>
<!--
  Headless-Chromium harness for tests/adversarial/terminal_right_click_headless.test.js.

  Two REAL `@xterm/xterm` 6 terminals, each at a fixed on-screen rect so the
  Node-side driver can aim CDP `Input.dispatchMouseEvent` right-clicks at them
  by plain viewport coordinates (`rect`):

    app    made by the app's own `getOrCreateTerminal`
           (src/components/terminal/terminalRegistry.js) — every installer,
           in the order the app runs them, the right-click binding included —
           with Settings ▸ Terminal ▸ Right Click at Copy or Paste
    stock  xterm and nothing else — the control: what xterm itself does with
           the very same click

  Both have xterm's `rightClickSelectsWord` on, so xterm's own right-click
  handler shows itself: it selects the word under the pointer (and moves its
  textarea there, for the webview's menu to paste into).

  The page is not inside Tauri, so `clipboard_read` is answered by the browser
  mock (`mockBridge.clipboard`, src/lib/ipc.js) — that is the clipboard here.
  `seen` lists the mouse events that reached each terminal's own element, from
  listeners in the bubble phase there, beside xterm's; `menus` keeps every
  context-menu event so the driver can ask afterwards whether it was
  cancelled; `copied` is what each copy event put on the clipboard.
  `write` resolves only once xterm's own write callback fires — a parse
  barrier, not a fire-and-forget write. `reset` replaces a pane's terminal
  with a fresh one, so no case inherits the last one's state.

  Not part of the app's own routes; loaded only by that test, over the vite
  dev server it starts on its own scratch config.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #111; }
      .pane { position: fixed; width: 560px; height: 240px; overflow: hidden; }
      #app { left: 0; top: 0; }
      #stock { left: 0; top: 260px; }
    </style>
  </head>
  <body>
    <div id="app" class="pane"></div>
    <div id="stock" class="pane"></div>
    <script type="module">
      import { Terminal } from '@xterm/xterm';
      import '@xterm/xterm/css/xterm.css';
      import { useSettingsStore } from '../../../src/stores/settingsStore.js';
      import { getOrCreateTerminal, disposeTerminal } from '../../../src/components/terminal/terminalRegistry.js';
      import { terminalRightClickFor } from '../../../src/lib/terminalRightClick.js';
      import { mockBridge } from '../../../src/lib/ipc.js';

      const COLS = 60;
      const ROWS = 14;
      const FONT = { fontFamily: 'monospace', fontSize: 14, lineHeight: 1 };
      const MOUSE = ['mousedown', 'mouseup', 'auxclick', 'contextmenu'];

      useSettingsStore.setState({
        terminalFontFamily: FONT.fontFamily,
        terminalFontSize: FONT.fontSize,
        terminalLineHeight: FONT.lineHeight,
        terminalRightClick: 'copyPaste',
      });

      // How often the clipboard was read for a paste.
      let reads = 0;
      const invoke = mockBridge.invoke.bind(mockBridge);
      mockBridge.invoke = (command, args) => {
        if (command === 'clipboard_read') reads += 1;
        return invoke(command, args);
      };

      const menus = [];
      window.addEventListener('contextmenu', (e) => menus.push(e), true);
      const copied = [];
      window.addEventListener('copy', (e) => copied.push(e.clipboardData?.getData('text/plain') ?? ''));

      let appTabs = 0;
      let appTabId = null;
      const terms = {};

      function tracked(term) {
        const data = [];
        const seen = [];
        term.onData((d) => data.push(d));
        for (const type of MOUSE) term.element.addEventListener(type, (e) => seen.push(`${type}:${e.button}`));
        term.options.rightClickSelectsWord = true;
        return { term, data, seen };
      }

      const makers = {
        app() {
          if (appTabId) disposeTerminal(appTabId);
          appTabId = `right-click-harness-${(appTabs += 1)}`;
          const entry = getOrCreateTerminal(appTabId, {});
          document.getElementById('app').replaceChildren(entry.container);
          entry.term.resize(COLS, ROWS);
          return tracked(entry.term);
        },
        stock() {
          terms.stock?.term.dispose();
          const term = new Terminal({ cols: COLS, rows: ROWS, allowProposedApi: true, ...FONT });
          term.open(document.getElementById('stock'));
          return tracked(term);
        },
      };

      const write = (which, text) => new Promise((resolve) => terms[which].term.write(text, resolve));

      async function reset(which) {
        terms[which] = makers[which]();
        // A word under the pointer, for xterm's own handler to select.
        await write(which, 'hello world from the harness\r\n');
        terms[which].data.length = 0;
        terms[which].seen.length = 0;
        return true;
      }

      await Promise.all(Object.keys(makers).map(reset));

      const screen = (which) => terms[which].term.element.querySelector('.xterm-screen');

      window.__r = {
        reset,
        write,
        /** Where the pane's screen is, in viewport coordinates. */
        rect: (which) => {
          const r = screen(which).getBoundingClientRect();
          return { left: r.left, top: r.top, width: r.width, height: r.height };
        },
        cellSize: (which) => {
          const r = screen(which).getBoundingClientRect();
          return { width: r.width / terms[which].term.cols, height: r.height / terms[which].term.rows };
        },
        data: (which) => terms[which].data.join(''),
        clearData: (which) => {
          terms[which].data.length = 0;
        },
        seen: (which) => terms[which].seen.slice(),
        clearSeen: (which) => {
          terms[which].seen.length = 0;
        },
        /** The context menus so far that came from `which`'s pane: whether each was cancelled. */
        menus: (which) =>
          menus.filter((e) => document.getElementById(which).contains(e.target)).map((e) => e.defaultPrevented),
        clearMenus: () => {
          menus.length = 0;
        },
        copied: () => copied.slice(),
        clearCopied: () => {
          copied.length = 0;
        },
        reads: () => reads,
        /** xterm's right-click handler raises its textarea to 1000 to sit under the pointer. */
        textareaZ: (which) => terms[which].term.textarea.style.zIndex,
        focused: (which) => document.activeElement === terms[which].term.textarea,
        select: (which, column, row, length) => terms[which].term.select(column, row, length),
        selection: (which) => terms[which].term.getSelection(),
        selectionPosition: (which) => terms[which].term.getSelectionPosition() ?? null,
        viewportY: (which) => terms[which].term.buffer.active.viewportY,
        mode: (which) => terms[which].term.modes.mouseTrackingMode,
        bracketed: (which) => terms[which].term.modes.bracketedPasteMode,
        setClipboard: (contents) => {
          mockBridge.clipboard = contents;
        },
        setRightClick: (value) => useSettingsStore.setState({ terminalRightClick: value }),
        /** The last paste the app's right-click started, settled. */
        pasting: async () => {
          await terminalRightClickFor(terms.app.term)?.pasting;
          return true;
        },
        platform: () => navigator.platform,
        ready: true,
      };
    </script>
  </body>
</html>
